<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LAFS - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <!-- Food Emojis -->
        <div class="food-emoji food1">🍕</div>
        <div class="food-emoji food2">🍔</div>
        <div class="food-emoji food3">🍟</div>
        <div class="food-emoji food4">🍕</div>
        <div class="food-emoji food5">🍰</div>
        <div class="food-emoji food6">🍜</div>

        <!-- Login Box -->
         <div class="login-image">
    <img src="images/login-couple.png" alt="LAFS food experience">
</div>
        <div class="login-box">

            <div class="login-logo">LAFS</div>

            <h1>Welcome Back!</h1>

            <p>Login to continue ordering your favourite food.</p>

            <form>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

        </div>

    </div>

</body>
</html>
