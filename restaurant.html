<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu - Foodie</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Foodie</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Restaurants</a>
            <a href="#">Offers</a>
            <a href="#">Help</a>
        </nav>

        <button class="login-btn">Login</button>
    </header>
    </header>

<div class="cart">
    🛒 Cart: <span id="cart-count">0</span>
</div>
    <main>

        <section class="menu-section">

            <h1>🍕 Pizza Palace</h1>

            <p>Pizza, Italian • ⭐ 4.5 • 30 mins</p>

            <h2>Popular Food</h2>

            <div class="menu-container">

                <div class="menu-card">
                    <div class="menu-emoji">🍕</div>
                    <h3>Margherita Pizza</h3>
                    <p>Classic cheese pizza</p>
                    <strong>₹199</strong>
                    <button>Add to Cart</button>
                </div>

                <div class="menu-card">
                    <div class="menu-emoji">🍕</div>
                    <h3>Farmhouse Pizza</h3>
                    <p>Fresh vegetables & cheese</p>
                    <strong>₹249</strong>
                    <button>Add to Cart</button>
                </div>

                <div class="menu-card">
                    <div class="menu-emoji">🥤</div>
                    <h3>Cold Drink</h3>
                    <p>Chilled soft drink</p>
                    <strong>₹59</strong>
                    <button>Add to Cart</button>
                </div>

                <div class="menu-card">
                    <div class="menu-emoji">🍰</div>
                    <h3>Chocolate Cake</h3>
                    <p>Rich chocolate dessert</p>
                    <strong>₹149</strong>
                    <button>Add to Cart</button>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
